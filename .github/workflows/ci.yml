name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

# PR: 새 커밋이 오면 앞 실행을 취소한다. develop · main push: 취소하지 않는다(#748) — 커밋마다 그룹이 달라 서로 밀지 않는다.
# Jenkins 가 develop 커밋마다 이 워크플로의 결과를 기다리므로, 머지를 몰아서 해도 각 커밋의 CI 가 끝까지 돈다.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read   # paths-filter 가 PR 의 바뀐 파일 목록을 읽는다
  actions: write        # buildx gha 캐시

jobs:
  # 바뀐 영역만 돌린다(#748). PR 은 base 와, push 는 직전 브랜치 끝(before)과 비교한다.
  # 이 파일이 바뀌면 모두 돈다. 건너뛴 잡은 실패가 아니다 — 묶음 판정은 맨 아래 ci-ok 가 한다
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      market-redis: ${{ steps.f.outputs.market-redis }}
      images: ${{ steps.f.outputs.images }}
      scripts: ${{ steps.f.outputs.scripts }}
    steps:
      - if: github.event_name != 'pull_request'     # PR 은 API 로 파일 목록을 읽는다 — 체크아웃이 필요 없다
        uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            backend:
              - *ci
              - backend/**
            frontend:
              - *ci
              - frontend/**
            market-redis:
              - *ci
              - backend/pyproject.toml
              - backend/desk/api.py
              - backend/desk/market_bus.py
              - backend/desk/settings.py
              - backend/desk/shared_cache.py
              - frontend/package.json
              - frontend/package-lock.json
              - frontend/src/api.ts
              - frontend/src/alertsFeed.ts
              - frontend/src/livePoll.ts
              - frontend/src/marketStream.ts
              - frontend/src/poll.ts
              - frontend/src/components/QuoteBoard.tsx
              - frontend/src/components/MarketFlowPanel.tsx
              - frontend/src/components/FuturesFlowView.tsx
              - frontend/tests/market-redis/**
            images:
              - *ci
              - backend/backend.Dockerfile
              - backend/backend.Dockerfile.dockerignore
              - backend/pyproject.toml
              - frontend/frontend.Dockerfile
              - frontend/frontend.Dockerfile.dockerignore
              - frontend/package.json
              - frontend/package-lock.json
              - frontend/nginx.conf.template
              - "**/docker-compose-*.yml"
            scripts:
              - *ci
              - .github/labeler.yml
              - .github/workflows/backend-role-labeler.yml
              - scripts/**
              - Jenkinsfile*
              - "**/docker-compose-*.yml"

  # 4 샤드 × 워커 4(-n auto). 테스트를 수집 순서대로 돌려 가며 나눈다(tests/conftest.py DESK_TEST_SHARD)
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend
    env:
      DESK_TEST_DATABASE_URL: postgresql+psycopg://desk:desk@localhost:5432/desk_test
      DESK_TEST_SHARD: ${{ matrix.shard }}/4
      # 워커 4개가 numpy · BLAS 스레드를 저마다 4개씩 열면 CPU 를 서로 뺏는다
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      # PostgreSQL 을 서비스 컨테이너 대신 직접 띄워 설치와 겹친다. 시험용이라 디스크 동기화를 끈다(fsync 등)
      - name: start PostgreSQL
        working-directory: .
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=desk -e POSTGRES_PASSWORD=desk -e POSTGRES_DB=desk_test \
            postgres:17 -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      # 설치된 venv 를 통째로 캐시한다(키 = 파이썬 버전 + pyproject). 맞으면 설치를 건너뛴다.
      # desk 는 편집 설치라 venv 가 작업 폴더를 가리킨다 — 코드가 바뀌어도 캐시를 다시 만들 필요가 없다
      - uses: actions/cache@v4
        id: venv
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('backend/pyproject.toml') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv .venv && .venv/bin/pip install -q -e ".[dev]"
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - if: matrix.shard == 1
        run: ruff check desk tests
      - name: wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do docker exec pg pg_isready -U desk -q && exit 0; sleep 1; done
          docker logs pg; exit 1
      # 워커마다 DB 를 따로 쓴다(tests/conftest.py pg_url). 느린 테스트 10개를 로그 끝에 남긴다
      - run: pytest -q -n auto --dist load --durations=10

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  # #690 public market SSE with an isolated real Redis and one browser. No operating credentials.
  market-redis:
    needs: changes
    if: needs.changes.outputs.market-redis == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        id: venv
        with:
          path: backend/.venv
          key: market-redis-ubuntu24-venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('backend/pyproject.toml') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        working-directory: backend
        run: python -m venv .venv && .venv/bin/pip install -q -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - run: node frontend/tests/market-redis/run.mjs

  # 배포 이미지가 실제로 빌드되는지만 본다(푸시하지 않는다). 서버(scripts/deploy.sh)와 같은 Dockerfile · 컨텍스트다.
  # Dockerfile · 의존성 · nginx 템플릿 · compose 가 바뀔 때만 돈다(#748). 층은 GitHub Actions 캐시에 남겨 다음에 다시 쓴다
  images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/backend.Dockerfile
          tags: trading-desk-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/frontend.Dockerfile
          tags: trading-desk-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: web image nginx config is valid (template rendered as at start)
        run: docker run --rm -e BACKEND_UPSTREAM=127.0.0.1:8000 trading-desk-web:ci nginx -t
      - name: backend image starts and serves /api/health
        run: |
          docker run -d --name be -e DESK_DATABASE_URL=sqlite:////tmp/desk.db trading-desk-backend:ci
          for i in $(seq 1 30); do
            docker exec be python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)" && exit 0
            sleep 2
          done
          docker logs be; exit 1
      # scripts/deploy-compose.sh 가 되돌림 전에 옛 · 새 이미지의 Alembic 리비전 파일을 이 명령으로 비교한다(#692)
      - name: backend image lists its migration files
        run: |
          docker run --rm --network none --entrypoint python trading-desk-backend:ci -c \
            'import pathlib, desk.migrations.versions as v; print("\n".join(sorted(p.name for p in pathlib.Path(v.__file__).parent.glob("*.py") if p.name != "__init__.py")))' \
            | tee /tmp/versions
          grep -qx 0001_initial.py /tmp/versions

  # 배포 스크립트(#692 · #691): 문법 검사와 가짜 docker · curl 로 돌리는 시험. 서버 · Vault · GitHub 에 닿지 않는다
  deploy-scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning scripts/*.sh scripts/jenkins/*.sh scripts/tests/*.sh
      - run: bash scripts/tests/deploy-compose.test.sh
      - run: bash scripts/tests/jenkins-scripts.test.sh
      - run: bash scripts/tests/backend-deploy-targets.test.sh
      - run: bash scripts/tests/backend-deploy-lease.test.sh
      - run: bash scripts/tests/wait-ci-require-head.test.sh

  backend-role-labels:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: ./.github/workflows/backend-role-labeler.yml

  # 필수 체크로 걸 하나(#748): 돈 잡이 모두 성공이고, 건너뛴 잡은 "변경 없음"으로 통과한다
  ci-ok:
    needs: [changes, backend, frontend, market-redis, images, deploy-scripts, backend-role-labels]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
          ROLE_LABEL_RESULT: ${{ needs.backend-role-labels.result }}
        run: |
          results=$(jq -r 'del(."backend-role-labels") | .[].result' <<< "$NEEDS")
          echo "결과: $results"
          # Jenkins defaults to a full deployment when routing evidence is missing.
          echo "역할 라벨 갱신: $ROLE_LABEL_RESULT"
          for r in $results; do
            case "$r" in success|skipped) ;; *) echo "실패한 잡이 있다: $r"; exit 1 ;; esac
          done
