name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U desk" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check desk tests
      - run: pytest -q
        env:
          DESK_TEST_DATABASE_URL: postgresql+psycopg://desk:desk@localhost:5432/desk_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # 배포 이미지가 실제로 빌드되는지만 본다(푸시하지 않는다). 서버(scripts/deploy.sh)와 같은 Dockerfile · 컨텍스트다
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/backend.Dockerfile -t trading-desk-backend:ci backend
      - run: docker build -f frontend/frontend.Dockerfile -t trading-desk-web:ci frontend
      - name: backend image starts and serves /api/health
        run: |
          docker run -d --name be -e DESK_DATABASE_URL=sqlite:////tmp/desk.db trading-desk-backend:ci
          for i in $(seq 1 30); do
            docker exec be python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)" && exit 0
            sleep 2
          done
          docker logs be; exit 1
