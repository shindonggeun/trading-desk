name: Compose API isolation drill

on:
  pull_request:
    paths:
      - .github/workflows/compose-api-isolation.yml
      - backend/docker-compose-backend.yml
      - scripts/deploy-compose.sh
      - scripts/tests/compose-api-isolation.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the synthetic HTTP image base
        run: docker --host unix:///var/run/docker.sock pull python:3.12-slim
      - name: Measure API replacement and rollback
        run: python3 -B scripts/tests/compose-api-isolation.py --run
