name: Compose API isolation drill

on:
  pull_request:
    paths:
      - .github/workflows/compose-api-isolation.yml
      - backend/docker-compose-backend.yml
      - Jenkinsfile.deploy-common.groovy
      - Jenkinsfile-backend-role
      - "deploy/jenkins/trading-desk/**"
      - "scripts/jenkins/backend-*"
      - scripts/jenkins/register-disabled-backend-jobs.py
      - scripts/jenkins/wait-ci.sh
      - scripts/deploy.sh
      - scripts/deploy-compose.sh
      - scripts/tests/backend-deploy-lease.test.sh
      - scripts/tests/wait-ci-require-head.test.sh
      - scripts/tests/test_jenkins_disabled_jobs.py
      - scripts/tests/compose-api-isolation.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the host fence and disabled Jenkins definitions
        run: |
          bash scripts/tests/backend-deploy-lease.test.sh
          bash scripts/tests/wait-ci-require-head.test.sh
          python3 -B scripts/tests/test_jenkins_disabled_jobs.py
      - name: Prepare the synthetic HTTP image base
        run: docker --host unix:///var/run/docker.sock pull python:3.12-slim
      - name: Measure API replacement and rollback
        run: python3 -B scripts/tests/compose-api-isolation.py --run
