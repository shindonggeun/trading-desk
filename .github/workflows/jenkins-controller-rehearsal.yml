name: Isolated Jenkins controller rehearsal

on:
  pull_request:
    paths:
      - .github/workflows/jenkins-controller-rehearsal.yml
      - "deploy/jenkins/rehearsal/hosted/**"
      - scripts/jenkins/backend-handoff.groovy
      - scripts/jenkins/backend-rehearsal.groovy
      - scripts/jenkins/backend-deploy-lease.sh
      - scripts/jenkins/backend-fence.sh
      - scripts/tests/backend-deploy-lease.test.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKER_CONFIG: ${{ runner.temp }}/td-jenkins-empty-docker-config
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the disposable controller from a fixture-only context
        shell: bash
        run: |
          unset DOCKER_CONTEXT DOCKER_HOST
          fixture=deploy/jenkins/rehearsal/hosted
          context=$(mktemp -d)
          trap 'rm -rf -- "$context"' EXIT
          cp "$fixture"/Dockerfile "$fixture"/init.groovy "$fixture"/pipeline.groovy "$fixture"/competitor.groovy "$context/"
          cp scripts/jenkins/backend-handoff.groovy scripts/jenkins/backend-rehearsal.groovy "$context/"
          docker --host unix:///var/run/docker.sock build --pull --tag td-jenkins-controller-fixture "$context"
      - name: Exercise real queue, ACL, cancellation and lock behavior in isolation
        run: env -u DOCKER_CONTEXT -u DOCKER_HOST python3 -B deploy/jenkins/rehearsal/hosted/run.py td-jenkins-controller-fixture
      - name: Check the #849 host fence separately with fake Docker
        run: bash scripts/tests/backend-deploy-lease.test.sh
