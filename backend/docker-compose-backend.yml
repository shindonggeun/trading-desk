# trading-desk 백엔드 배포 정의 (docs/deploy.md).
#
#   docker compose -p trading-desk-backend-prod --env-file ../../.env.runtime -f docker-compose-backend.yml \
#     up -d --build --wait --remove-orphans backend-prod
# scripts/deploy.sh 가 위 명령을 부른다. -p 를 빼지 않는다 — 빠지면 디렉터리 이름이 프로젝트가 돼 다른 compose 와 섞이고
# --remove-orphans 가 남의 컨테이너를 지울 수 있다.
#
# 호스트 포트를 열지 않는다. 웹 컨테이너만 같은 외부 네트워크(DESK_DOCKER_NETWORK)로 컨테이너 이름을 불러 닿는다 —
# 열면 X-Forwarded-For 위조로 로그인 시도 제한을 우회할 수 있다(docs/security.md §4).
#
# 값은 저장소에 쓰지 않는다. 키 이름은 루트 .env.example, 실값은 서버 ~/deploy/trading-desk/.env.runtime(권한 600).
# environment 에는 앱 · TradingAgents 가 실제로 읽는 키만 넘긴다. 키를 더하면 여기와 .env.example 을 같은 PR 에서 맞춘다.

x-backend-environment: &backend_environment
  # PostgreSQL(main-server 192.168.0.11, 스키마 desk). 기본값을 두지 않는다 — 비면 컨테이너 안 SQLite 로 떠 기록이 볼륨 밖에서 사라진다
  DESK_DATABASE_URL: ${DESK_DATABASE_URL:?docs/deploy.md 3절}
  # true = 대본 러너(LLM 호출 없음). ChatGPT 로그인 전까지 true 로 둔다
  DESK_FAKE_RUNS: ${DESK_FAKE_RUNS:-false}
  DESK_FAKE_DELAY: ${DESK_FAKE_DELAY:-0.6}
  DESK_MAX_CONCURRENT_RUNS: ${DESK_MAX_CONCURRENT_RUNS:-1}
  # AI 채팅이 고를 수 있는 모델(쉼표 목록)과 기본값(#414). 비면 gpt-6-luna,gpt-6-sol
  DESK_CHAT_MODELS: ${DESK_CHAT_MODELS:-}
  DESK_CHAT_MODEL: ${DESK_CHAT_MODEL:-}
  # 모델 속도 제한(429) 뒤 이 시간(분) 동안은 1개씩만 돌린다(#171)
  DESK_RATE_LIMIT_COOLDOWN_MIN: ${DESK_RATE_LIMIT_COOLDOWN_MIN:-30}
  # 채팅 모델이 얹히는 등급(#404) quick | deep(기본 deep)과 채팅만의 추론 강도. DESK_CHAT_MODEL 이 비면 그 등급 모델(목록에 있을 때)
  DESK_CHAT_MODEL_TIER: ${DESK_CHAT_MODEL_TIER:-deep}
  DESK_CHAT_REASONING_EFFORT: ${DESK_CHAT_REASONING_EFFORT:-}
  # 같은 종목 · 날짜 · 보기 · 언어로 N분 안에 다시 분석하면 뉴스 · 펀더멘털 보고서를 재사용(#171). 0 = 끔
  DESK_REUSE_REPORTS_MIN: ${DESK_REUSE_REPORTS_MIN:-0}
  # 끝난 분석 기록 보관 일수. 기동 시 · 하루 1회 지난 run 을 지운다. 0 = 지우지 않음
  DESK_RETENTION_DAYS: ${DESK_RETENTION_DAYS:-90}
  # 끝난 계획을 이후 봉으로 채점하는 주기(초). 0 = 끄기
  DESK_SCORE_INTERVAL_SEC: ${DESK_SCORE_INTERVAL_SEC:-3600}
  DESK_MACRO_INTERVAL_SEC: ${DESK_MACRO_INTERVAL_SEC:-3600}
  DESK_REPORT_EVERY_DAYS: ${DESK_REPORT_EVERY_DAYS:-3}
  # #681 (선택) 리포트 모델 · 추론 강도 · 주제 순환 — 비면 deep 모델 · 공급자 기본 · 기본 목록
  DESK_REPORT_MODEL: ${DESK_REPORT_MODEL:-}
  DESK_REPORT_REASONING: ${DESK_REPORT_REASONING:-}
  DESK_REPORT_TOPICS: ${DESK_REPORT_TOPICS:-}
  DESK_MORNING_BRIEF_AT: ${DESK_MORNING_BRIEF_AT:-07:00}
  # #497 (선택) 리포트 설명 그림 — 키가 비면 꺼진다
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  DESK_REPORT_IMAGES_PER_DAY: ${DESK_REPORT_IMAGES_PER_DAY:-4}
  DESK_REPORT_IMAGES_PER_MONTH: ${DESK_REPORT_IMAGES_PER_MONTH:-20}
  DESK_REPORT_IMAGE_MODEL: ${DESK_REPORT_IMAGE_MODEL:-}
  DESK_FUTURES_SNAPSHOT_MIN: ${DESK_FUTURES_SNAPSHOT_MIN:-1}
  DESK_LOG_LEVEL: ${DESK_LOG_LEVEL:-}
  # GDELT 테마 과거 파일 폴더(cli news-history · backtest, #390). 비우면 data/gdelt
  DESK_GDELT_CACHE: ${DESK_GDELT_CACHE:-}
  # 로그인 세션 (docs/security.md §2). 쿠키는 HTTPS 앞단 뒤에서만 쓰므로 Secure 를 끄지 않는다
  DESK_SESSION_MAX_HOURS: ${DESK_SESSION_MAX_HOURS:-72}
  DESK_SESSION_IDLE_HOURS: ${DESK_SESSION_IDLE_HOURS:-12}
  DESK_COOKIE_SECURE: "true"
  DESK_ENABLE_DOCS: "false"
  # 서버는 같은 출처(nginx 뒤)만 — 교차 출처 허용은 로컬 개발에서만 쓴다(#628)
  DESK_CORS_ORIGINS: ""
  # OTP 비밀값 봉인 키(docs/security.md §6). 비면 OTP 를 켤 수 없고, OTP 가 켜진 계정은 로그인이 503 으로 막힌다
  DESK_OTP_KEY: ${DESK_OTP_KEY:-}
  # 브로커: mock | toss. toss 는 서버 공인 IP 를 토스 WTS 허용 IP 에 등록해야 한다(docs/deploy.md 6절)
  DESK_BROKER: ${DESK_BROKER:-mock}
  TOSS_CLIENT_ID: ${TOSS_CLIENT_ID:-}
  TOSS_CLIENT_SECRET: ${TOSS_CLIENT_SECRET:-}
  TOSS_ACCOUNT_SEQ: ${TOSS_ACCOUNT_SEQ:-}
  DESK_KIS_APP_KEY: ${DESK_KIS_APP_KEY:-}
  DESK_KIS_APP_SECRET: ${DESK_KIS_APP_SECRET:-}
  DESK_KIS_WS_URL: ${DESK_KIS_WS_URL:-}
  DESK_KIS_REST_URL: ${DESK_KIS_REST_URL:-}
  # #601 KRX OPEN API 인증키(일별 이력 수집). 비면 수집이 꺼진다(값은 서버 .env.runtime 에만)
  DESK_KRX_API_KEY: ${DESK_KRX_API_KEY:-}
  DESK_KOSDAQ_SYMBOLS: ${DESK_KOSDAQ_SYMBOLS:-}
  # 내 투자 패널 SSE 갱신 주기(초, 2~60). 시세 · 환율은 서버에서 ~10초 캐시를 공유한다
  DESK_PORTFOLIO_STREAM_SEC: ${DESK_PORTFOLIO_STREAM_SEC:-5}
  # semibot 은 PC 에서 돈다. 서버에서는 레짐 패널이 빈다
  SEMIBOT_DB_PATH: ""
  # #361 웹 푸시(VAPID). 셋 중 하나라도 비면 푸시가 꺼진다
  DESK_VAPID_PUBLIC_KEY: ${DESK_VAPID_PUBLIC_KEY:-}
  DESK_VAPID_PRIVATE_KEY: ${DESK_VAPID_PRIVATE_KEY:-}
  DESK_VAPID_SUBJECT: ${DESK_VAPID_SUBJECT:-}
  # #580 텔레그램 · 카카오톡 알림 채널. 비면 그 채널이 꺼진다(값은 서버 .env.runtime 에만)
  DESK_PUBLIC_URL: ${DESK_PUBLIC_URL:-}
  DESK_TELEGRAM_BOT_TOKEN: ${DESK_TELEGRAM_BOT_TOKEN:-}
  DESK_TELEGRAM_CHAT_ID: ${DESK_TELEGRAM_CHAT_ID:-}
  DESK_KAKAO_REST_KEY: ${DESK_KAKAO_REST_KEY:-}
  DESK_KAKAO_CLIENT_SECRET: ${DESK_KAKAO_CLIENT_SECRET:-}
  DESK_NOTIFY_KEY: ${DESK_NOTIFY_KEY:-}
  # TradingAgents 가 직접 읽는 키
  TRADINGAGENTS_LLM_PROVIDER: ${TRADINGAGENTS_LLM_PROVIDER:-chatgpt}
  TRADINGAGENTS_QUICK_THINK_LLM: ${TRADINGAGENTS_QUICK_THINK_LLM:-}
  TRADINGAGENTS_DEEP_THINK_LLM: ${TRADINGAGENTS_DEEP_THINK_LLM:-}
  TRADINGAGENTS_OUTPUT_LANGUAGE: ${TRADINGAGENTS_OUTPUT_LANGUAGE:-Korean}
  TRADINGAGENTS_MAX_DEBATE_ROUNDS: ${TRADINGAGENTS_MAX_DEBATE_ROUNDS:-1}
  TRADINGAGENTS_MAX_RISK_ROUNDS: ${TRADINGAGENTS_MAX_RISK_ROUNDS:-1}
  TRADINGAGENTS_DEBATE_PARALLEL_FIRST_ROUND: ${TRADINGAGENTS_DEBATE_PARALLEL_FIRST_ROUND:-}
  TRADINGAGENTS_RISK_PARALLEL_FIRST_ROUND: ${TRADINGAGENTS_RISK_PARALLEL_FIRST_ROUND:-}
  TRADINGAGENTS_QUICK_THINK_REASONING_EFFORT: ${TRADINGAGENTS_QUICK_THINK_REASONING_EFFORT:-}
  TRADINGAGENTS_DEEP_THINK_REASONING_EFFORT: ${TRADINGAGENTS_DEEP_THINK_REASONING_EFFORT:-}
  TRADINGAGENTS_NO_UPDATE_CHECK: "1"
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  SEC_EDGAR_USER_AGENT: ${SEC_EDGAR_USER_AGENT:-}
  FRED_API_KEY: ${FRED_API_KEY:-}
  # 로그 시각만 바뀐다. 저장 시각은 언제나 UTC
  TZ: ${TIME_ZONE:-Asia/Seoul}

x-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 세 서비스가 함께 쓰는 정의(#688): 같은 이미지 · 같은 볼륨 · 같은 health 확인. 다른 것은 DESK_ROLE · 네트워크 · 메모리뿐이다
x-backend-service: &backend_service
  image: trading-desk-backend:prod
  volumes:
    # ChatGPT 로그인(chatgpt-auth.json) · TradingAgents 메모리 로그 · 리포트 · 데이터 캐시. 백업 대상이다(docs/deploy.md 7절)
    - tradingagents_home:/home/app/.tradingagents
  # /api/health 는 세션 없이 열린 유일한 GET 이다({"ok": true} 만 준다). 확인은 컨테이너 안에서 한다
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
    interval: 15s
    timeout: 5s
    retries: 4
    # TradingAgents · langchain import 와 Alembic upgrade 시간
    start_period: 60s
  # 진행 중인 SSE 응답을 끊을 시간. 진행 중인 분석은 재시작 시 failed 로 표시된다(워커 스레드는 프로세스와 함께 끝난다)
  stop_grace_period: 30s
  restart: unless-stopped
  logging: *default_logging

# #688 백엔드 나누기: DESK_BACKEND_SPLIT=1 이면 scripts/deploy-compose.sh 가 profile split 을 켜고 backend-prod 를 api 로 띄운다.
# 0(기본)이면 backend-prod 하나가 all 이다(나누기 전과 같다). 켜기 전 선행 조건 · 켜고 끄는 법: docs/deploy.md 12절.
# 이 compose 를 손으로 부르지 않는다 — 스위치와 DESK_ROLE 을 맞추는 것이 deploy-compose.sh 다.
services:
  backend-prod:
    <<: *backend_service
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: trading-desk-backend-prod
    environment:
      <<: *backend_environment
      # #688 이 프로세스가 띄울 백그라운드 작업(desk/roles.py): all | api. deploy-compose.sh 가 DESK_BACKEND_SPLIT 에 맞춰
      # 셸 환경으로 넘긴다(.env.runtime 보다 앞선다). 공통 env 에 DESK_ROLE 을 두면 모든 서비스가 같은 역할이 된다
      DESK_ROLE: ${DESK_API_ROLE:-all}
    labels:
      # 스위치 값을 compose 키로 남긴다 — Jenkins 의 vault-env.sh 는 compose 에 나오는 키만 env 파일에 넣는다
      desk.backend-split: ${DESK_BACKEND_SPLIT:-0}
    # 웹 컨테이너가 이름으로 닿는 유일한 백엔드(BACKEND_UPSTREAM)
    networks:
      - desk
    # all 일 때 LangGraph · pandas 가 분석 중에 수백 MB 를 쓴다(동시 실행 1 기준). split 의 api 는 1g 로 충분하다
    mem_limit: ${DESK_BACKEND_MEM_LIMIT:-2g}

  # 시세 · 수급 수집, 알림, 정기 작업, 브로커 토큰 발급(desk/roles.py). 웹 네트워크에 붙지 않는다 — 밖으로 나가는 연결만 쓴다
  collector-prod:
    <<: *backend_service
    profiles: [split]
    container_name: trading-desk-collector-prod
    environment:
      <<: *backend_environment
      DESK_ROLE: collector
    # api 가 Alembic upgrade head 를 끝내고 healthy 가 된 뒤에 뜬다(여기서는 이미 head 라 아무것도 하지 않는다)
    depends_on:
      backend-prod:
        condition: service_healthy
    networks:
      - default
    mem_limit: ${DESK_COLLECTOR_MEM_LIMIT:-1g}

  # LLM 분석 run(대기열을 DB 에서 가져간다) · 아침 시황 · 리포트 · 채점. 하나만 둔다 — 두 번째는 PG advisory lock 에 막혀 대기열을 집지 않는다
  analyst-prod:
    <<: *backend_service
    profiles: [split]
    container_name: trading-desk-analyst-prod
    environment:
      <<: *backend_environment
      DESK_ROLE: analyst
    depends_on:
      backend-prod:
        condition: service_healthy
    networks:
      - default
    mem_limit: ${DESK_ANALYST_MEM_LIMIT:-2g}

volumes:
  tradingagents_home:
    name: trading-desk-tradingagents-home

# desk: 웹 compose 와 같은 외부 네트워크(backend-prod 만). scripts/deploy-compose.sh 가 없으면 만든다.
# default: 이 프로젝트만의 네트워크(collector · analyst). DB · Redis · 외부 API 로 나가는 연결만 쓴다
networks:
  desk:
    name: ${DESK_DOCKER_NETWORK:?docs/deploy.md 3절}
    external: true
  default:
