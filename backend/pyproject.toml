[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-desk"
version = "0.1.0"
description = "Web desk for TradingAgents: watch the agents argue like a chat, keep the plans on a dashboard."
requires-python = ">=3.11"
dependencies = [
    # TradingAgents is used as a library and pinned to one commit of the fork.
    # Bump the SHA deliberately after reading upstream's CHANGELOG.
    # Now the tip of the fork branch feat/parallel-openings (#171): rebase it onto a new upstream.
    "tradingagents @ git+https://github.com/shindonggeun/TradingAgents.git@5a74a7a0211932326eaa73f2ac71c95fc91daf22",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=14",          # the asyncio client API (desk.broker.kis_stream)
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=42",
    "holidays>=0.60",          # KRX / NYSE closed days for the market calendar (desk.market_calendar)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["desk*"]

[tool.setuptools.package-data]
"desk.migrations" = ["alembic.ini", "script.py.mako"]
"desk" = ["data/*.json", "data/backtest/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
