server {
    listen 80;
    root /usr/share/nginx/html;

    # The real client address: believe X-Real-IP only from the homelab ingress (storage 192.168.0.12).
    # Anyone else (LAN, docker) is taken at their own address.
    set_real_ip_from 192.168.0.12;
    real_ip_header X-Real-IP;

    location /api/ {
        proxy_pass http://backend:8000;
        # $http_host keeps a non-default port, so the API's Origin == Host check holds on :8088 too.
        proxy_set_header Host $http_host;
        # Overwrite, never append: a client-sent X-Forwarded-For must not reach uvicorn --proxy-headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Server-sent events: no buffering, long reads (a run takes minutes).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri /index.html;
    }
}
