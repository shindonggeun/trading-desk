<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>분석 상태 전용 응답 회귀</title>
<div id="root"></div>
<script type="module">
  // Vite 개발 서버에서 /tests/run-status-only.html을 연다. 모든 API와 SSE는 합성 응답이다.
  import { createElement as h, Fragment } from "react";
  import { createRoot } from "react-dom/client";
  import RunView from "../src/pages/RunView";
  import ChartView from "../src/pages/ChartView";
  import RunsCard from "../src/components/RunsCard";
  import RecentRuns from "../src/components/RecentRuns";

  const root = createRoot(document.getElementById("root"));
  const delay = window.setTimeout.bind(window);
  window.setTimeout = (fn, ms, ...args) => delay(fn, ms === 5000 ? 100 : ms, ...args);
  const wait = (ms) => new Promise((resolve) => delay(resolve, ms));
  const assert = (ok, reason) => { if (!ok) throw new Error(reason); };
  async function until(check, reason) {
    for (let i = 0; i < 160; i++) {
      if (check()) return;
      await wait(20);
    }
    throw new Error(reason);
  }
  const details = [];
  const explanations = [];
  const streams = [];
  let eventsReads = 0;
  const today = "2026-11-22";
  const owned = {
    id: "sample", ticker: "NVDA", trade_date: today, status: "done", plan: null,
    options: { analysts: [], use_portfolio: false, output_language: null, name: "합성 이름" },
    created_at: today + "T01:00:00Z", started_at: null, finished_at: null, error: null, report_path: null,
  };
  const limited = (status, id = "sample") => ({ id, status });
  let listItems = [{ ...owned, id: "full-failed", status: "failed" }, limited("progress", "progress"),
    limited("completed", "completed"), limited("failed", "failed")];
  const hold = (list, options) => new Promise((resolve) =>
    list.push({ send: (data) => resolve(Response.json(data)), signal: options?.signal }));
  window.fetch = (input, options) => {
    const { pathname: path, searchParams } = new URL(input, location.origin);
    if (path === "/api/runs/sample") return hold(details, options);
    if (path === "/api/runs/sample/explain") return hold(explanations, options);
    if (path.endsWith("/events")) eventsReads++;
    if (path === "/api/runs") {
      assert(options.cache === "no-store", "목록을 캐시에서 재사용할 수 있습니다");
      return Promise.resolve(Response.json({ items: listItems, total: 4, page: 1, size: Number(searchParams.get("size")) }));
    }
    if (path === "/api/favorites") return Promise.resolve(Response.json([]));
    return Promise.resolve(Response.json({ detail: "합성 404" }, { status: 404 }));
  };
  window.EventSource = class {
    static CLOSED = 2;
    constructor(url) { this.url = url; this.readyState = 1; streams.push(this); }
    close() { this.readyState = 2; }
    emit(event) { this.onmessage?.({ data: JSON.stringify(event) }); }
  };

  const text = () => document.getElementById("root").textContent;
  const completed = "분석이 완료됐습니다. 이 화면에서는 결과를 볼 수 없습니다.";
  const errors = [];
  window.addEventListener("error", (event) => errors.push(event.message));
  window.addEventListener("unhandledrejection", (event) => errors.push(String(event.reason)));

  try {
    history.replaceState(null, "", "#/runs/sample/easy");
    root.render(h(RunView, { runId: "sample", key: "sample" }));
    await until(() => details.length === 1, "초기 상세 요청");
    assert(!streams.length && !explanations.length, "상세 확인 전에 본문을 요청했습니다");
    details[0].send(limited("progress"));
    await until(() => text().includes("분석이 진행 중입니다."), "진행 상태 문구");
    await until(() => details.length === 2, "진행 상태 상세 재조회");
    assert(!streams.length && !explanations.length, "진행 상태에서 본문을 요청했습니다");
    details[1].send(owned);
    await until(() => streams.length === 1 && explanations.length === 1 && text().includes("합성 이름"), "전체 응답 전환");

    const stream = streams[0];
    const lateMessage = stream.onmessage;
    stream.emit({ seq: 1, type: "status", data: {} });
    await until(() => details.length === 3, "먼저 시작한 상세 요청");
    stream.emit({ seq: 2, type: "status", data: {} });
    await until(() => details.length === 4, "나중에 시작한 상세 요청");
    details[3].send(limited("completed"));
    await until(() => text().trim() === completed && stream.readyState === EventSource.CLOSED &&
      explanations[0].signal.aborted, "권한 축소 후 본문 제거와 요청 종료");
    details[2].send({ ...owned, ticker: "LATE", options: { ...owned.options, name: "늦은 상세 비공개" } });
    explanations[0].send({ title: "늦은 해설 비공개" }); // mock fetch는 abort 이후에도 응답시킨다
    lateMessage({ data: JSON.stringify({ seq: 3, type: "message", data: { text: "늦은 SSE 비공개" } }) });
    await wait(250);
    assert(text().trim() === completed && streams.length === 1 && explanations.length === 1 &&
      details.length === 4 && eventsReads === 0, "늦은 본문 또는 불필요한 재조회가 상태 전용 화면에 영향을 줬습니다");

    root.render(h(RunView, { runId: "missing", key: "missing" }));
    await until(() => text().includes("합성 404"), "기존 404 문구");
    assert(streams.length === 1, "404에서 SSE를 열었습니다");

    root.render(h(ChartView, { ticker: "NVDA", query: new URLSearchParams("run=sample"), key: "chart" }));
    await until(() => details.length === 5, "차트 연결 상세 GET");
    details[4].send(limited("failed"));
    await until(() => text().trim() === "분석을 완료하지 못했습니다.", "차트 연결 상태 전용 문구");

    root.render(h(Fragment, null, h(RunsCard), h(RecentRuns)));
    await until(() => document.querySelector(".runs-card")?.textContent.includes(completed) &&
      document.querySelector(".recent-runs")?.textContent.includes(completed), "목록 상태 전용 행");
    assert(text().includes("합성 이름") && text().includes("분석을 완료하지 못했습니다.") &&
      document.querySelectorAll('a[href="#/runs/failed"]').length === 2, "full 실패와 상태 전용 실패를 구분하지 못했습니다");
    listItems = [limited("completed", "full-failed"), ...listItems.slice(1)];
    await until(() => !text().includes("합성 이름") && document.querySelectorAll('a[href="#/runs/full-failed"]').length === 2,
      "두 목록의 이전 full 행 제거");
    assert(errors.length === 0, errors.join("\n"));
    document.body.dataset.result = "passed";
  } catch (error) {
    document.body.dataset.result = error.stack;
  } finally {
    root.unmount();
  }
</script>
</html>
